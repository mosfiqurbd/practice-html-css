<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #d3c7c7;
            padding: 10px 20px;
            color: white;
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        .navbar ul li {
            display: inline;
        }
        .navbar ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
        }
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        .menu-toggle div {
            width: 30px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
            transition: 0.4s;
        }
        .menu-toggle.active div:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .menu-toggle.active div:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.active div:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .nav-icons{
            width:400px ;
    display: flex;
    gap: 30px;
    justify-content: center;
    text-align: center;
        }
        @media (max-width: 768px) {
            .navbar ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 50px;
                left: 0;
                background-color: #333;
                width: 100%;
                text-align: center;
            }
            .navbar ul.show {
                display: flex;
            }
            .menu-toggle {
                display: flex;
            }
            .nav-icons{
                flex-direction: column;
                
            }
        }
        .hero {
            background: url('hero-image.jpg') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }
        .products {
            text-align: center;
            padding: 50px 20px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-item {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Furniro</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="menu-toggle" onclick="toggleMenu()">
                <div></a></div>
                <div></div>
                <div></div>
            </div>
            <div class="nav-icons">
                <a href="#"> <img src="./asset/css/image/mdi_account-alert-outline.png" alt=""></a>
                <a href="#"><i class="fas fa-search"></i></a>
                <a href=""><img src="./asset/css/image/akar-icons_heart.png" alt=""></a>
                <a href="#"><i class="fas fa-shopping-cart"></i></a>
                <a href="#"><i class="fa-solid fa-person"></i></a>
                <a href="#"><i class="fa-solid fa-heart-crack"></i></a>
            </div>
        </div>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Our New Collection</h1>
            <p>Get the best furniture for your home with stylish designs.</p>
            <button>Shop Now</button>
        </div>
    </section>
    <section class="products">
        <h2>Our Products</h2>
        <div class="product-grid">
            <div class="product-item">Product 1</div>
            <div class="product-item">Product 2</div>
            <div class="product-item">Product 3</div>
            <div class="product-item">Product 4</div>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 Furniro. All rights reserved.</p>
    </footer>
    <script>
        function toggleMenu() {
            document.querySelector(".nav-links").classList.toggle("show");
            document.querySelector(".menu-toggle").classList.toggle("active");
        }
    </script>
</body>
</html>
