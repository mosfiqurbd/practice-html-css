<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Breadcrumbs */
        .breadcrumbs {
            padding: 15px 0;
            font-size: 14px;
            color: #666;
        }
        
        .breadcrumbs a {
            color: #666;
            text-decoration: none;
        }
        
        .breadcrumbs a:hover {
            text-decoration: underline;
        }
        
        .breadcrumbs span {
            margin: 0 5px;
        }
        
        /* Page Header */
        .page-header {
            margin-bottom: 20px;
        }
        
        .page-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        hr {
            border: 0;
            height: 1px;
            background-color: #ddd;
            margin: 20px 0;
        }
        
        /* Filter Section */
        .filter-section {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .filter-header h2 {
            font-size: 18px;
            color: #444;
        }
        
        .filter-options {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .filter-dropdown {
            display: flex;
            align-items: center;
        }
        
        .filter-dropdown label {
            margin-right: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .filter-dropdown select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .results-count {
            font-size: 14px;
            color: #666;
        }
        
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .product-card {
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
        }
        
        .product-image {
            height: 200px;
            background-color: #eee;
            position: relative;
        }
        
        .product-dimensions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .product-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            background-color: rgba(255,255,255,0.9);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-title {
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .product-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        
        .tag {
            background-color: #f0f0f0;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Breadcrumbs -->
        <div class="breadcrumbs">
            <a href="#">Home</a> <span>></span> <a href="#">Shop</a>
        </div>
        
        <!-- Page Header -->
        <div class="page-header">
            <h1>Shop</h1>
        </div>
        
        <hr>
        
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-header">
                <h2>Filter</h2>
                <div class="results-count">Showing 1-16 of 32 results</div>
            </div>
            
            <div class="filter-options">
                <div class="filter-dropdown">
                    <label>Show</label>
                    <select>
                        <option>16</option>
                        <option>32</option>
                        <option>64</option>
                    </select>
                </div>
                
                <div class="filter-dropdown">
                    <label>Sort by</label>
                    <select>
                        <option>Default</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                        <option>Newest</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Product Grid -->
        <div class="product-grid">
            <!-- Product Card 1 -->
            <div class="product-card">
                <div class="product-image">
                    <div class="product-dimensions">1440 x 100</div>
                    <div class="product-actions">
                        <button class="action-btn">+</button>
                        <button class="action-btn">⇄</button>
                    </div>
                </div>
                <div class="product-info">
                    <h3 class="product-title">Sultihartna</h3>
                    <p class="product-description">Insulzen | Tallin | Beamless</p>
                    <div class="product-tags">
                        <span class="tag">New</span>
                        <span class="tag">Popular</span>
                    </div>
                </div>
            </div>
            
            <!-- Additional product cards would go here -->
            <!-- You can duplicate the product-card div for more products -->
        </div>
    </div>
</body>
</html>
