<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse The Range</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        .browse-section {
            padding: 60px 20px;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-header h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .section-header p {
            color: #666;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .category-card {
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .category-card:hover {
            transform: translateY(-10px);
        }
        
        .category-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .category-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
        
        /* Responsive Styles */
        @media (max-width: 768px) {
            .section-header h2 {
                font-size: 28px;
            }
            
            .category-card {
                min-width: 100%;
            }
            
            .category-image {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <section class="browse-section">
        <div class="section-header">
            <h2>Browse The Range</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>
        
        <div class="categories">
            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1583845112203-454375aa0a5e?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" 
                     alt="Dining Room" class="category-image">
                <h3 class="category-name">Dining</h3>
            </div>
            
            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" 
                     alt="Living Room" class="category-image">
                <h3 class="category-name">Living</h3>
            </div>
            
            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" 
                     alt="Bedroom" class="category-image">
                <h3 class="category-name">Bedroom</h3>
            </div>
        </div>
    </section>
</body>
</html>
