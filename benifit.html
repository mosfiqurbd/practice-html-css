<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .features {
            display: flex;
            justify-content: space-around;
            background-color: #f9f1e7;
            padding: 20px;
            text-align: center;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature img {
            width: 40px;
            height: 40px;
        }
        .text {
            text-align: left;
        }
        .text h4 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }
        .text p {
            margin: 0;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="features">
        <div class="feature">
            <img src="trophy-icon.png" alt="High Quality">
            <div class="text">
                <h4>High Quality</h4>
                <p>crafted from top materials</p>
            </div>
        </div>
        <div class="feature">
            <img src="warranty-icon.png" alt="Warranty Protection">
            <div class="text">
                <h4>Warranty Protection</h4>
                <p>Over 2 years</p>
            </div>
        </div>
        <div class="feature">
            <img src="shipping-icon.png" alt="Free Shipping">
            <div class="text">
                <h4>Free Shipping</h4>
                <p>Order over 150 $</p>
            </div>
        </div>
        <div class="feature">
            <img src="support-icon.png" alt="24/7 Support">
            <div class="text">
                <h4>24 / 7 Support</h4>
                <p>Dedicated support</p>
            </div>
        </div>
    </div>
</body>
</html>
