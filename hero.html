<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Arrival Collection</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        .new-arrival {
            display: flex;
            align-items: center;
            min-height: 600px;
            background-color: #f9f9f9;
            padding: 60px 5%;
            position: relative;
            overflow: hidden;
        }
        
        .content {
            max-width: 500px;
            z-index: 2;
        }
        
        .subtitle {
            font-size: 18px;
            color: #b88e2f;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #333;
        }
        
        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .cta-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #b88e2f;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .cta-button:hover {
            background-color: #a57d2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(181, 142, 47, 0.3);
        }
        
        .image-container {
            position: absolute;
            right: 5%;
            width: 50%;
            height: 80%;
            background-image: url('https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
        }
        
        /* Responsive Styles */
        @media (max-width: 992px) {
            .new-arrival {
                flex-direction: column;
                text-align: center;
                padding: 80px 5%;
            }
            
            .content {
                max-width: 100%;
                margin-bottom: 40px;
            }
            
            .image-container {
                position: relative;
                right: auto;
                width: 100%;
                height: 400px;
            }
            
            .title {
                font-size: 36px;
            }
        }
        
        @media (max-width: 576px) {
            .title {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .image-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <section class="new-arrival">
        <div class="content">
            <p class="subtitle">New Arrival</p>
            <h1 class="title">Discover Our<br>New Collection</h1>
            <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit tellus, luctus nec ullamcorper mattis.</p>
            <a href="#" class="cta-button">BUY NOW</a>
        </div>
        <div class="image-container"></div>
    </section>
</body>
</html>
