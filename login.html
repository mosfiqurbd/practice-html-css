<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glassmorphism Login</title>
  <style>
  /* 1. Global Reset and Base Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    /* Use a background image that covers the entire screen. 
       The image in the screenshot is a night road; you can replace it with your own. */
    xt=Night+Road+BG") no-repeat center center/cover;
    font-family: "Arial", sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* 2. Container with Glassmorphism Effect */
  .login-container {
    /* Semi-transparent white box */
    background: rgba(255, 255, 255, 0.1);
    
    /* Glass blur effect (backdrop-filter) */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  
    /* Optional border to accentuate the glass effect */
    border: 1px solid rgba(255, 255, 255, 0.3);
  
    padding: 2rem;
    width: 320px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
  }
  
  /* 3. Title */
  .title {
    color: #fff;
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }
  
  /* 4. Login Form */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .input-field {
    position: relative;
  }
  .input-field .icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    pointer-events: none;
  }
  .input-field input {
    width: 100%;
    padding: 0.75rem 0.75rem 0.75rem 2.5rem;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
  
    /* Transparent input field style */
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  .input-field input::placeholder {
    color: rgba(25, 255, 255, 0.7);
  }
  
  /* 5. Login Button */
  .login-btn {
    padding: 0.75rem;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    background: rgba(25, 255, 255, 0.2);
    color: #fff;
    transition: background 0.3s ease;
  }
  .login-btn:hover {
    background: rgba(255, 255, 255, 0.4);
  }
  
  /* 6. Separator Text */
  .separator {
    color: #fff;
    margin: 1rem 0;
  }
  
  /* 7. Social Login Buttons */
  .social-login {
    display: flex;
    gap: 1rem;
    justify-content: center;
  }
  .social-btn {
    flex: 1;
    padding: 0.75rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    font-weight: bold;
    transition: background 0.3s ease;
  }
  .facebook {
    background: #4267B2;
  }
  .google {
    background: #DB4437;
  }
  .social-btn:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>

  <div class="login-container">
    <h2 class="title">Foolish Developer</h2>
    <form class="login-form" action="#" method="POST">
      <div class="input-field">
        <span class="icon">👤</span>
        <input type="email" placeholder="Email Id" required />
      </div>
      <div class="input-field">
        <span class="icon">🔒</span>
        <input type="password" placeholder="Password" required />
      </div>
      <button type="submit" class="login-btn">Log In</button>
    </form>
    
    <p class="separator">Or</p>
    
    <div class="social-login">
      <button class="social-btn facebook">Facebook</button>
      <button class="social-btn google">G Google</button>
    </div>
  </div>

</body>
</html>
