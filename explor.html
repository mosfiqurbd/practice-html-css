<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Carousel Section</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f9f9f9;
        }
        .carousel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 20px;
        }
        .carousel-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            position: relative;
            gap: 20px;
        }
        .carousel-text {
            flex: 1 1 40%;
            padding: 20px;
            text-align: left;
        }
        .carousel-images {
            flex: 1 1 50%;
            display: flex;
            gap: 20px;
            overflow: hidden;
            align-items: center;
        }
        .carousel-images img {
            width: 100%;
            border-radius: 10px;
        }
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }
        .prev {
            left: 10px;
        }
        .next {
            right: 10px;
        }
        .carousel-dots {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background: gray;
            border-radius: 50%;
            cursor: pointer;
        }
        .active {
            background: gold;
        }
        @media (max-width: 768px) {
            .carousel-content {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .carousel-text {
                text-align: center;
            }
            .carousel-images {
                gap: 10px;
            }
            .carousel-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-content">
            <div class="carousel-text">
                <h2>50+ Beautiful rooms inspiration</h2>
                <p>Our designer already made a lot of beautiful prototype of rooms that inspire you</p>
                <button>Explore More</button>
            </div>
            <div class="carousel-images">
                <button class="carousel-nav prev">&#9664;</button>
                <img src="https://source.unsplash.com/400x300/?interior" alt="Room 1">
                <img src="https://source.unsplash.com/400x300/?furniture" alt="Room 2">
                <button class="carousel-nav next">&#9654;</button>
            </div>
        </div>
        <div class="carousel-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
