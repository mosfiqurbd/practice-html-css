<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Selectors Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #2ecc71;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin: 5px;
            background: #ddd;
            border-radius: 5px;
        }
        li:first-child {
            font-weight: bold;
        }
        li:last-child {
            color: #e74c3c;
        }
        li:nth-child(2) {
            background: #f39c12;
            color: white;
        }
        li:not(:first-child) {
            border-left: 5px solid #3498db;
        }
    </style>
</head>
<body>
    <h2>Pseudo Selectors Demo</h2>
    <button>Hover Me</button>
    <br><br>
    <input type="text" placeholder="Focus on me">
    <br><br>
    <ul>
        <li>First Item (first-child)</li>
        <li>Second Item (nth-child(2))</li>
        <li>Third Item</li>
        <li>Fourth Item</li>
        <li>Last Item (last-child)</li>
    </ul>
</body>
</html>
