<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
        div{
           font-family: Arial, Helvetica, sans-serif;
           color: #000;
           font-size: 50px;
        }*/
        .box6{
           width: 300px; 
           height: 300px; 
           background-color: yellow;
           

        }
        .box1{
            width: 300px; 
           height: 300px; 
           background-color: tomato;
           position: absolute;
           right: 0;
           
           
        }
        .box2{
            width: 400px; 
           height: 400px; 
           background-color: gray;
           position: absolute;
           left: 50%;
           top: 50%;
           margin-top: -150px;
           margin-left: -150px;
        }
        .box3{
            width: 300px; 
           height: 300px; 
           background-color: gainsboro;
           position: absolute;
           right: 0;
           bottom: 0;
        }
        .box4{
            width: 300px; 
           height: 300px; 
           background-color: green;
        }
        .box5{
            width: 300px; 
           height: 300px; 
           background-color: beige;
           position: fixed;
           left: 500px;
           top: 500px;

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box6"></div>
        <h1>hello world</h1>
    </div>

    <div class="box1">1</div>
    <div class="box2">2</div>
    <div class="box3">3</div>
    <div class="box4">4</div>
    <div class="box5">5</div>
    <div class="box5">6</div>

</body>
</html>
